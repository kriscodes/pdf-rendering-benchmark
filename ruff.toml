required-version = "==0.17.5"
target-version = "py313"
include = ["packages/**/*.py", "tools/quality/**/*.py"]
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F", "B006", "B008", "B012", "B018", "B904"]
# Compound-line formatting is deferred while the measured sources are frozen.
# Correctness rules remain enabled; see tools/quality/README.md.
ignore = ["E701", "E702"]
